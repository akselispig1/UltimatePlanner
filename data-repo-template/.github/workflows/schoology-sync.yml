name: schoology-sync
# Pulls assignments + trip events every 6 hours (§3.2). If your school disabled
# personal API keys, disable this workflow and enter assignments manually.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: schoology-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull Schoology
        env:
          SCHOOLOGY_KEY: ${{ secrets.SCHOOLOGY_KEY }}
          SCHOOLOGY_SECRET: ${{ secrets.SCHOOLOGY_SECRET }}
          SCHOOLOGY_BASE: ${{ secrets.SCHOOLOGY_BASE }}
        run: node scripts/sync-schoology.mjs
      - name: Commit changes
        run: |
          git config user.name "life-balancer-bot"
          git config user.email "life-balancer-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "schoology-sync [skip ci]"
          git push
